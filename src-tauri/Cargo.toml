[package]
name = "vpn-app"
version = "0.1.0"
description = "Лёгкий клиент для обхода DPI с автопереключением стратегий"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "window-minimize", "window-show", "window-hide", "process-exit", "window-close", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[features]
default = ["elevate"]
# Вшивает в exe манифест requireAdministrator — без него winws.exe не
# запускается (ошибка 740). Выключается только для тестов:
#   cargo test --no-default-features
elevate = []
custom-protocol = ["tauri/custom-protocol"]

# Профиль релиза заточен под минимальный размер и оверхед в рантайме —
# нам критично не отжирать ресурсы у игр/других процессов в фоне
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
